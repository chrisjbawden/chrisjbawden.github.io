<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <title>Chris Bawden</title>
    <link rel="stylesheet" href="/stylesheets/styles.css">
    <link rel="stylesheet" href="/stylesheets/pygment_trac.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      /* Search bar lives inside the content section so it won't overlap the sidebar */
      .blog-search-wrap {
        display: flex;
        justify-content: center;
        padding: 12px 16px 0 16px;
      }
      #post-search {
        width: 100%;
        max-width: 880px;     /* keep it neat */
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      /* Year heading + centred vertical separator */
      .year-heading {
        text-align: center;
        margin: 28px 0 10px 0;
      }
      .year-separator {
        width: 2px;
        height: 40px;
        background: #cfcfcf;
        margin: 12px auto 6px auto;
      }

      /* Post buttons */
      .post-item {
        max-width: 880px;
        margin: 10px auto;
      }
      .post-open-btn {
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border: 1px solid #d6d6d6;
        border-radius: 14px;
        background: linear-gradient(180deg, #ffffff 0%, #f4f6f8 100%);
        color: #222;
        font: inherit;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }
      .post-open-btn:hover {
        transform: translateY(-1px);
        border-color: #b9b9b9;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
        background: linear-gradient(180deg, #ffffff 0%, #eef1f4 100%);
      }
      .post-open-btn:focus-visible {
        outline: 3px solid #1e5aa8;
        outline-offset: 3px;
      }
      .post-open-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: visible;
        text-overflow: initial;
        white-space: normal;
        line-height: 1.35;
      }
      .post-open-meta {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(32, 39, 48, 0.08);
        color: #444;
        font-size: 0.82rem;
        letter-spacing: 0.01em;
      }
      .post-open-meta::after {
        content: "↗";
        font-size: 0.95em;
        line-height: 1;
      }

      /* Modal */
      body.modal-open {
        overflow: hidden;
      }
      .post-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10050;
        padding: 24px;
        background: rgba(8, 12, 18, 0.74);
        backdrop-filter: blur(6px);
      }
      .post-modal.open {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: auto;
      }
      .post-modal-panel {
        position: relative;
        width: min(940px, 100%);
        margin: 42px 0;
        max-height: calc(100vh - 84px);
        overflow: auto;
        border-radius: 20px;
        background: #fff;
        color: #222;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .post-modal-shell {
        position: relative;
        padding: 28px 28px 32px 28px;
      }
      .post-modal-close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 999px;
        background: rgba(24, 28, 32, 0.08);
        color: #1f1f1f;
        font-size: 30px;
        line-height: 1;
        cursor: pointer;
      }
      .post-modal-close:hover {
        background: rgba(24, 28, 32, 0.14);
      }
      .post-modal-close:focus-visible {
        outline: 3px solid #1e5aa8;
        outline-offset: 2px;
      }
      .post-modal-kicker {
        margin: 0 0 10px 0;
        color: #6b7280;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .post-modal-title {
        margin: 0 0 18px 0;
        padding-right: 56px;
        color: #111;
        font-size: clamp(1.6rem, 2.5vw, 2.25rem);
        line-height: 1.1;
      }
      .post-modal-body {
        font-size: 1rem;
        line-height: 1.6;
      }
      .post-modal-body img {
        max-width: 100%;
        height: auto;
      }
      .post-modal-body iframe,
      .post-modal-body video {
        max-width: 100%;
      }
    </style>

  </head>

  <body>
    <div class="wrapper">

      <div id="sidebar-placeholder"></div>
      <script>
        fetch('/sidebar.html')
          .then(res => res.text())
          .then(html => {
            const container = document.getElementById('sidebar-placeholder');
            container.innerHTML = html;
            const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');
            const links = container.querySelectorAll('#main-menu a');
            links.forEach(link => {
              const href = link.getAttribute('href').replace(/\/index\.html$/, '/');
              if (href === currentPath) link.style.display = 'none';
            });
          });
      </script>

      <section id="blog-posts" style="padding-left:20px;">
        <!-- Search inside the content column so it doesn't cross the sidebar -->
        <div class="blog-search-wrap">
          <input id="post-search" type="search" placeholder="Search posts…">
        </div>
        <!-- Blog posts will be dynamically loaded below -->
      </section>

      <div id="post-modal" class="post-modal" aria-hidden="true">
        <div class="post-modal-panel" role="dialog" aria-modal="true" aria-labelledby="post-modal-title">
          <div class="post-modal-shell">
            <button type="button" id="post-modal-close" class="post-modal-close" aria-label="Close post">×</button>
            <p class="post-modal-kicker">Blog post</p>
            <h2 id="post-modal-title" class="post-modal-title"></h2>
            <div id="post-modal-body" class="post-modal-body"></div>
          </div>
        </div>
      </div>

      <script>
        // ===== CONFIG =====
        const OWNER    = "chrisjbawden";
        const REPO     = "chrisjbawden.github.io";
        const BRANCHES = ["main", "master"];   // try main then master
        const POSTS_DIR = "blog/posts";        // repo path to HTML posts
        const POSTS_BY_ID = new Map();

        // ===== Helpers =====
        const encodePath = (p) => p.split("/").map(encodeURIComponent).join("/");

        const rawBaseFor = (branch, dir) =>
          `https://raw.githubusercontent.com/${OWNER}/${REPO}/${encodeURIComponent(branch)}/${dir.replace(/\/+$/,'')}/`;

        // List .html files in POSTS_DIR from the repo (no Pages involved)
        async function listPostFiles() {
          const enc = encodePath(POSTS_DIR);
          for (const branch of BRANCHES) {
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${enc}?ref=${encodeURIComponent(branch)}`;
            console.debug("List posts URL:", url);
            const res = await fetch(url);
            if (res.ok) {
              const items = await res.json();
              return items
                .filter(x => x.type === "file" && /\.html?$/i.test(x.name) && x.name.toLowerCase() !== "index.html")
                .map(x => ({
                  name: x.name,
                  rawUrl: x.download_url,
                  branch,
                  dirRawBase: rawBaseFor(branch, POSTS_DIR)
                }));
            }
          }
          return [];
        }

        // Parse date from filename prefix "YYYY-MM-DD-..." (for sorting only)
        function parseDateFromFilename(name) {
          const m = name.match(/^(\d{4})-(\d{2})-(\d{2})[-_ ]/);
          if (!m) return null;
          const [ , y, mo, d ] = m;
          const iso = `${y}-${mo}-${d}`;
          const ts = Date.parse(iso);
          if (isNaN(ts)) return null;
          return { iso, year: y, ts };
        }

        // Strip a leading date pattern from a string title
        function stripLeadingDate(s) {
          return s.replace(/^\s*\d{4}-\d{2}-\d{2}[-_ ]*\s*/,'');
        }

        // Rewrite relative src/href inside the HTML to the raw repo base, so images/CSS in posts work
        function rewriteRelativeUrls(html, base) {
          const doc = new DOMParser().parseFromString(html, "text/html");
          const fixUrl = (u) => {
            if (!u) return u;
            if (/^[a-z]+:\/\//i.test(u) || u.startsWith("data:") || u.startsWith("mailto:") || u.startsWith("#")) return u;
            if (u.startsWith("/")) return u; // keep site-root links
            return base + u.replace(/^\.\/+/, "");
          };
          doc.querySelectorAll("[src]").forEach(el => el.setAttribute("src", fixUrl(el.getAttribute("src"))));
          doc.querySelectorAll("link[href]").forEach(el => el.setAttribute("href", fixUrl(el.getAttribute("href"))));
          doc.querySelectorAll("a[href]").forEach(el => el.setAttribute("href", fixUrl(el.getAttribute("href"))));
          return doc.body ? doc.body.innerHTML : html;
        }

        async function fetchPostMeta(file) {
          try {
            const res = await fetch(file.rawUrl);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const htmlText = await res.text();

            const doc = new DOMParser().parseFromString(htmlText, "text/html");
            let title =
              (doc.querySelector("h1") && doc.querySelector("h1").textContent.trim()) ||
              (doc.querySelector("title") && doc.querySelector("title").textContent.trim()) ||
              file.name.replace(/\.html?$/i, "");

            // Remove any leading date from the title we display
            title = stripLeadingDate(title);

            const cleaned = rewriteRelativeUrls(htmlText, file.dirRawBase);
            const date = parseDateFromFilename(file.name);

            // Plain text (for searching)
            const textContent = (doc.body ? doc.body.textContent : "")
              .replace(/\s+/g, " ").trim();

            const id = file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-");

            return { ...file, id, title, date, html: cleaned, text: textContent };
          } catch (e) {
            console.warn("Failed to fetch post:", file.name, e);
            const date = parseDateFromFilename(file.name);
            const id = file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
            return { ...file, id, title: stripLeadingDate(file.name.replace(/\.html?$/i, "")), date, html: `<p>Failed to load post content.</p>`, text: "" };
          }
        }

        function setModalOpen(isOpen) {
          const modal = document.getElementById("post-modal");
          modal.classList.toggle("open", isOpen);
          modal.setAttribute("aria-hidden", isOpen ? "false" : "true");
          document.body.classList.toggle("modal-open", isOpen);
        }

        function clearPostHash() {
          const url = `${window.location.pathname}${window.location.search}`;
          window.history.replaceState(null, "", url);
        }

        function openPostModal(postId, { updateHash = true } = {}) {
          const post = POSTS_BY_ID.get(postId);
          if (!post) return;

          const titleEl = document.getElementById("post-modal-title");
          const bodyEl = document.getElementById("post-modal-body");
          const panel = document.querySelector(".post-modal-panel");

          titleEl.textContent = post.title;
          bodyEl.innerHTML = "";

          const article = document.createElement("article");
          article.className = "post-modal-article";
          article.innerHTML = post.html;
          bodyEl.appendChild(article);
          panel.scrollTop = 0;

          setModalOpen(true);

          if (updateHash) {
            const url = `${window.location.pathname}${window.location.search}#${postId}`;
            window.history.replaceState(null, "", url);
          }

          const closeBtn = document.getElementById("post-modal-close");
          closeBtn.focus();
        }

        function closePostModal({ updateHash = true } = {}) {
          setModalOpen(false);
          if (updateHash && window.location.hash) {
            clearPostHash();
          }
        }

        function renderPosts(posts) {
          const container = document.getElementById("blog-posts");

          // Clear existing (keep the search bar div)
          const searchWrap = container.querySelector(".blog-search-wrap");
          container.innerHTML = "";
          if (searchWrap) container.appendChild(searchWrap);

          if (!posts.length) {
            const p = document.createElement("p");
            p.textContent = "No posts found yet. Add .html files under /blog/posts in the repo.";
            container.appendChild(p);
            return;
          }

          // Group by year
          const groups = {};
          for (const p of posts) {
            const y = (p.date && p.date.year) || "Unsorted";
            if (!groups[y]) groups[y] = [];
            groups[y].push(p);
          }

          const years = Object.keys(groups).sort((a,b) => b.localeCompare(a));

          years.forEach((year, idx) => {
            // Vertical separator above each year except the first
            if (idx > 0) {
              const sep = document.createElement("div");
              sep.className = "year-separator";
              container.appendChild(sep);
            }

            // Year heading
            const h = document.createElement("h3");
            h.className = "year-heading";
            h.textContent = year;
            container.appendChild(h);

            // Sort posts in this year: newest first (date), then name
            const sorted = groups[year].sort((a,b) => {
              const at = a.date?.ts ?? 0, bt = b.date?.ts ?? 0;
              if (bt !== at) return bt - at;
              return b.name.localeCompare(a.name);
            });

            for (const post of sorted) {
              POSTS_BY_ID.set(post.id, post);

              const item = document.createElement("div");
              item.className = "post-item";
              item.dataset.title = post.title.toLowerCase();
              item.dataset.text  = (post.text || "").toLowerCase();
              item.dataset.year  = year;

              const button = document.createElement("button");
              button.type = "button";
              button.className = "post-open-btn";
              button.id = post.id;
              button.setAttribute("aria-haspopup", "dialog");
              button.setAttribute("aria-controls", "post-modal");
              button.dataset.postId = post.id;

              const titleSpan = document.createElement("span");
              titleSpan.className = "post-open-title";
              titleSpan.textContent = post.title;

              const metaSpan = document.createElement("span");
              metaSpan.className = "post-open-meta";
              metaSpan.textContent = "Open";

              button.appendChild(titleSpan);
              button.appendChild(metaSpan);
              button.addEventListener("click", () => openPostModal(post.id));
              item.appendChild(button);
              container.appendChild(item);
            }
          });
        }

        // Live search: filter posts, hide empty years & separators
        function setupSearch() {
          const input = document.getElementById("post-search");
          const container = document.getElementById("blog-posts");

          const applyFilter = () => {
            const q = input.value.trim().toLowerCase();
            const posts = Array.from(container.querySelectorAll(".post-item"));
            const yearHeadings = Array.from(container.querySelectorAll(".year-heading"));
            const separators   = Array.from(container.querySelectorAll(".year-separator"));

            posts.forEach(p => {
              const hay = p.dataset.title + " " + p.dataset.text;
              p.style.display = hay.includes(q) ? "" : "none";
            });

            yearHeadings.forEach(h => {
              const year = h.textContent.trim();
              const hasVisible = posts.some(p => p.dataset.year === year && p.style.display !== "none");
              h.style.display = hasVisible ? "" : "none";
            });

            separators.forEach(sep => {
              const next = sep.nextElementSibling; // year heading
              const show = next && next.classList.contains("year-heading") && next.style.display !== "none";
              sep.style.display = show ? "" : "none";
            });
          };

          input.addEventListener("input", applyFilter);
        }

        function setupModal() {
          const modal = document.getElementById("post-modal");
          const closeBtn = document.getElementById("post-modal-close");
          const panel = modal.querySelector(".post-modal-panel");

          closeBtn.addEventListener("click", () => closePostModal());
          modal.addEventListener("click", (event) => {
            if (event.target === modal) closePostModal();
          });

          window.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && modal.classList.contains("open")) {
              closePostModal();
            }
          });

          window.addEventListener("hashchange", () => {
            const postId = window.location.hash.slice(1);
            if (!postId) {
              closePostModal({ updateHash: false });
              return;
            }
            if (POSTS_BY_ID.has(postId)) {
              openPostModal(postId, { updateHash: false });
            } else {
              closePostModal({ updateHash: false });
            }
          });
        }

        (async () => {
          setupModal();
          const files = await listPostFiles();
          const metas = await Promise.all(files.map(fetchPostMeta));
          renderPosts(metas);
          setupSearch();

          // Re-run hash opener once content exists
          if (window.location.hash) window.dispatchEvent(new Event("hashchange"));
        })();
      </script>

      </footer>
    </div>

    <script src="/javascripts/scale.fix.js"></script>
  </body>
