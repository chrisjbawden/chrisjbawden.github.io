	  <script>
(function() {
  let buffer = "";
  let overlay = null;
  let timer = null;

  // Replace with your own MP4 link!
  const mp4Url = "media/error.mp4";

  function showVideoOverlay() {
    // Remove existing overlay if needed
    if (overlay) overlay.remove();

    // Create overlay div
    overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100vw";
    overlay.style.height = "100vh";
    overlay.style.background = "#000";
    overlay.style.zIndex = "9999";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.transition = "opacity 0.5s";

    // Create video element
    const video = document.createElement("video");
    video.src = mp4Url;
    video.autoplay = true;
    video.muted = true; // Avoids browser autoplay restrictions
    video.loop = false;
    video.controls = false;
    video.style.maxWidth = "100vw";
    video.style.maxHeight = "100vh";
    video.style.boxShadow = "0 0 32px #000";
    video.playsInline = true;

    overlay.appendChild(video);
    document.body.appendChild(overlay);

    // Play the video (for some browsers)
    video.play();

    // Remove after 10 seconds
    timer = setTimeout(() => {
      overlay.style.opacity = "0";
      setTimeout(() => { overlay.remove(); overlay = null; }, 500);
    }, 10000);
  }

  document.addEventListener("keydown", function(e) {
    if (e.key.length === 1) {
      buffer += e.key.toLowerCase();
      if (buffer.length > 8) buffer = buffer.slice(-8);

      if (buffer.endsWith("password")) {
        buffer = "";
        if (timer) clearTimeout(timer);
        showVideoOverlay();
      }
    }
  });
})();
</script>

	<script>
	  (() => {
	    const overlay = document.getElementById('terminal-overlay');
	    const openButton = document.getElementById('terminal-trigger');
	    const closeButton = document.getElementById('terminal-close');
	    const windowEl = document.getElementById('terminal-window');
	    const headerEl = document.getElementById('terminal-header');
	    const form = document.getElementById('terminal-form');
	    const input = document.getElementById('terminal-input');
	    const output = document.getElementById('terminal-output');

	    if (!overlay || !openButton || !closeButton || !form || !input || !output) {
	      return;
	    }

	    const appendLine = (text, className = 'terminal-line') => {
	      const line = document.createElement('div');
	      line.className = className;
	      line.textContent = text;
	      output.appendChild(line);
	      output.scrollTop = output.scrollHeight;
	    };

	    const terminalHistory = [];

	    const siteListings = {
	      '/': ['blog/', 'index.html', 'javascripts/', 'media/', 'portfolio/', 'sidebar.html', 'stylesheets/'],
	      '.': ['blog/', 'index.html', 'javascripts/', 'media/', 'portfolio/', 'sidebar.html', 'stylesheets/'],
	      blog: ['bin/', 'blog.html', 'cs50.html', 'loader.js', 'media/', 'pick/', 'posts/'],
	      portfolio: ['badges/', 'certificates/', 'content.json', 'media/', 'portfolio.html', 'tertiary/'],
	      media: ['6C83376E-6257-4D85-9631-B2F3EF39B982.png', 'error.mp4', 'hash.png', 'mail_icon_128820.png', 'profile/', 'qr-code.png', 'video.mp4', 'xml.png'],
	      stylesheets: ['pygment_trac.css', 'styles.css'],
	      javascripts: ['scale.fix.js']
	    };

	    const normalizeTarget = (target) => {
	      const trimmed = target.trim();
	      if (!trimmed) {
	        return '';
	      }

	      if (/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(trimmed)) {
	        return trimmed;
	      }

	      return `https://${trimmed}`;
	    };

	    const normalizeLocalPath = (target) => {
	      const trimmed = target.trim();
	      if (!trimmed) {
	        return '';
	      }

	      return trimmed.replace(/^\/+/, '').replace(/\/+$/, '') || '/';
	    };

	    const splitCommand = (rawValue) => {
	      const parts = rawValue.trim().match(/"[^"]*"|'[^']*'|\S+/g) || [];
	      const command = (parts.shift() || '').toLowerCase();
	      const args = parts.map((part) => part.replace(/^["']|["']$/g, ''));
	      return { command, args };
	    };

	    const openTerminal = () => {
	      overlay.style.display = 'flex';
	      overlay.setAttribute('aria-hidden', 'false');
	      positionWindow();
	      input.value = '';
	      input.focus();
	    };

	    const closeTerminal = () => {
	      overlay.style.display = 'none';
	      overlay.setAttribute('aria-hidden', 'true');
	    };

	    const runCommand = async (rawValue) => {
	      const value = rawValue.trim();
	      if (!value) {
	        return;
	      }

	      terminalHistory.push(value);
	      appendLine(`> ${value}`, 'terminal-line terminal-command');

	      const { command, args } = splitCommand(value);

	      if (command === 'dev') {
	        document.cookie = 'dev=1; path=/; max-age=28800; samesite=lax';
	        appendLine('Dev cookie set for 8 hours.', 'terminal-line terminal-success');
	        window.open('/preview.html', '_blank', 'noopener');
	        return;
	      }

	      if (command === 'exit') {
	        closeTerminal();
	        return;
	      }

	      if (command === 'help') {
	        appendLine('Available commands: dev, exit, clear, whoami, pwd, ls, echo <text>, date, uname, ping <host>, curl <url>, nslookup <host>', 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'clear') {
	        output.innerHTML = '';
	        return;
	      }

	      if (command === 'history') {
	        if (!terminalHistory.length) {
	          appendLine('(no history yet)', 'terminal-line terminal-system');
	          return;
	        }

	        terminalHistory.forEach((entry, index) => {
	          appendLine(`${index + 1}  ${entry}`, 'terminal-line terminal-system');
	        });
	        return;
	      }

	      if (command === 'whoami') {
	        appendLine('Developer', 'terminal-line terminal-system');
	        appendLine('Security researcher', 'terminal-line terminal-system');
	        appendLine('...', 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'pwd') {
	        appendLine('/', 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'ls') {
	        const target = args[0] ? normalizeLocalPath(args[0]) : '/';
	        const entries = siteListings[target === '/' ? '/' : target];
	        if (!entries) {
	          appendLine(`ls: cannot access '${args[0] || target}': no listing available in browser terminal`, 'terminal-line terminal-error');
	          return;
	        }

	        appendLine(entries.join('  '), 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'echo') {
	        appendLine(args.join(' ') || '', 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'cat') {
	        const target = args[0];
	        if (!target) {
	          appendLine('Usage: cat <path>', 'terminal-line terminal-error');
	          return;
	        }

	        const path = normalizeLocalPath(target);
	        try {
	          const response = await fetch(path, { cache: 'no-store' });
	          if (!response.ok) {
	            appendLine(`cat: ${target}: ${response.status} ${response.statusText}`, 'terminal-line terminal-error');
	            return;
	          }

	          const bodyText = await response.text();
	          appendLine(bodyText || '[empty file]', 'terminal-line terminal-system');
	        } catch (error) {
	          appendLine(`cat: ${target}: unable to read in browser context`, 'terminal-line terminal-error');
	        }
	        return;
	      }

	      if (command === 'date') {
	        appendLine(new Date().toString(), 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'uname') {
	        appendLine(`${navigator.userAgent}`, 'terminal-line terminal-system');
	        return;
	      }

	      if (command === 'ping') {
	        const target = args[0];
	        if (!target) {
	          appendLine('Usage: ping <host-or-url>', 'terminal-line terminal-error');
	          return;
	        }

	        const url = normalizeTarget(target);
	        const startedAt = performance.now();
	        try {
	          await fetch(`${url}${url.includes('?') ? '&' : '?'}_=${Date.now()}`, {
	            method: 'GET',
	            cache: 'no-store',
	            mode: 'no-cors'
	          });
	          appendLine(`Reply from ${target}: time=${Math.round(performance.now() - startedAt)}ms`, 'terminal-line terminal-success');
	        } catch (error) {
	          appendLine(`Ping failed for ${target}.`, 'terminal-line terminal-error');
	        }
	        return;
	      }

	      if (command === 'curl') {
	        const target = args[0];
	        if (!target) {
	          appendLine('Usage: curl <url>', 'terminal-line terminal-error');
	          return;
	        }

	        const url = normalizeTarget(target);
	        try {
	          const response = await fetch(url, { cache: 'no-store' });
	          const bodyText = await response.text();
	          appendLine(`HTTP ${response.status} ${response.statusText}`, 'terminal-line terminal-system');
	          response.headers.forEach((value, key) => {
	            appendLine(`${key}: ${value}`, 'terminal-line terminal-system');
	          });
	          appendLine(bodyText.slice(0, 1000) || '[empty body]', 'terminal-line terminal-success');
	        } catch (error) {
	          appendLine(`curl failed for ${target}. Browser CORS or network restrictions may apply.`, 'terminal-line terminal-error');
	        }
	        return;
	      }

	      if (command === 'nslookup') {
	        const host = args[0];
	        if (!host) {
	          appendLine('Usage: nslookup <host>', 'terminal-line terminal-error');
	          return;
	        }

	        try {
	          const response = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=A`, {
	            headers: {
	              Accept: 'application/dns-json'
	            },
	            cache: 'no-store'
	          });
	          const data = await response.json();
	          const answers = Array.isArray(data.Answer) ? data.Answer : [];
	          if (!answers.length) {
	            appendLine(`No A records found for ${host}.`, 'terminal-line terminal-system');
	            return;
	          }

	          appendLine(`Name: ${host}`, 'terminal-line terminal-system');
	          answers.forEach((answer) => {
	            appendLine(`Address: ${answer.data}`, 'terminal-line terminal-success');
	          });
	        } catch (error) {
	          appendLine(`nslookup failed for ${host}.`, 'terminal-line terminal-error');
	        }
	        return;
	      }

	      appendLine(`Unknown command: ${value}`, 'terminal-line terminal-error');
	    };

	    const positionWindow = () => {
	      const rect = windowEl.getBoundingClientRect();
	      const left = Math.max(12, (window.innerWidth - rect.width) / 2);
	      const top = Math.max(12, (window.innerHeight - rect.height) / 2);
	      windowEl.style.left = `${left}px`;
	      windowEl.style.top = `${top}px`;
	    };

	    const clampWindow = () => {
	      const rect = windowEl.getBoundingClientRect();
	      const maxLeft = window.innerWidth - rect.width - 12;
	      const maxTop = window.innerHeight - rect.height - 12;
	      const currentLeft = parseFloat(windowEl.style.left || `${rect.left}`) || rect.left;
	      const currentTop = parseFloat(windowEl.style.top || `${rect.top}`) || rect.top;
	      windowEl.style.left = `${Math.min(Math.max(12, currentLeft), Math.max(12, maxLeft))}px`;
	      windowEl.style.top = `${Math.min(Math.max(12, currentTop), Math.max(12, maxTop))}px`;
	    };

	    let dragState = null;

	    const startDrag = (event) => {
	      if (event.target.closest('button, input, textarea, select, a')) {
	        return;
	      }

	      event.preventDefault();
	      const rect = windowEl.getBoundingClientRect();
	      dragState = {
	        offsetX: event.clientX - rect.left,
	        offsetY: event.clientY - rect.top
	      };
	      windowEl.style.transform = 'none';
	      windowEl.style.left = `${rect.left}px`;
	      windowEl.style.top = `${rect.top}px`;
	      document.body.style.userSelect = 'none';
	    };

	    const moveDrag = (event) => {
	      if (!dragState) {
	        return;
	      }

	      const rect = windowEl.getBoundingClientRect();
	      const nextLeft = event.clientX - dragState.offsetX;
	      const nextTop = event.clientY - dragState.offsetY;
	      const maxLeft = window.innerWidth - rect.width - 12;
	      const maxTop = window.innerHeight - rect.height - 12;

	      windowEl.style.left = `${Math.min(Math.max(12, nextLeft), Math.max(12, maxLeft))}px`;
	      windowEl.style.top = `${Math.min(Math.max(12, nextTop), Math.max(12, maxTop))}px`;
	    };

	    const stopDrag = () => {
	      if (!dragState) {
	        return;
	      }

	      dragState = null;
	      document.body.style.userSelect = '';
	    };

	    openButton.addEventListener('click', openTerminal);
	    closeButton.addEventListener('click', closeTerminal);
	    headerEl.addEventListener('pointerdown', startDrag);
	    window.addEventListener('pointermove', moveDrag);
	    window.addEventListener('pointerup', stopDrag);
	    window.addEventListener('resize', clampWindow);

	    overlay.addEventListener('click', (event) => {
	      if (event.target === overlay) {
	        closeTerminal();
	      }
	    });

	    document.addEventListener('keydown', (event) => {
	      if (event.key === 'Escape' && overlay.style.display === 'flex') {
	        closeTerminal();
	      }
	    });

	    form.addEventListener('submit', (event) => {
	      event.preventDefault();
	      runCommand(input.value);
	      input.value = '';
	      input.focus();
	    });

	    input.addEventListener('keydown', (event) => {
	      if (event.key === 'Escape') {
	        closeTerminal();
	      }
	    });
	  })();
	</script>
