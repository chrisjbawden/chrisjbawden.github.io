<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script>
    (() => {
      const hasDevCookie = document.cookie
        .split(";")
        .map(cookie => cookie.trim())
        .some(cookie => cookie === "dev=1");

      if (!hasDevCookie) {
        window.location.replace("/index.html");
      }
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Dev Preview</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>

<body>

  <iframe
    id="previewFrame"
    title="Development Preview"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
  ></iframe>

  <script>
    const CONFIG = {
      owner: "chrisjbawden",
      repo: "chrisjbawden.github.io",
      branch: "master",
      directory: "dev",
      entryFile: "index.html"
    };

    const frame = document.getElementById("previewFrame");

    const RAW_ROOT =
      `https://raw.githubusercontent.com/` +
      `${CONFIG.owner}/` +
      `${CONFIG.repo}/` +
      `${CONFIG.branch}/` +
      `${CONFIG.directory}/`;

    let currentPath = CONFIG.entryFile;

    function cacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}_dev=${Date.now()}`;
    }

    function isExternalUrl(value) {
      return (
        /^(?:[a-z]+:)?\/\//i.test(value) ||
        value.startsWith("mailto:") ||
        value.startsWith("tel:") ||
        value.startsWith("data:") ||
        value.startsWith("blob:")
      );
    }

    function getDirectoryFromPath(path) {
      const normalised = path.replace(/^\/+/, "");

      const lastSlash = normalised.lastIndexOf("/");

      if (lastSlash === -1) {
        return "";
      }

      return normalised.slice(0, lastSlash + 1);
    }

    function resolveRepoPath(value, basePath = currentPath) {
      if (!value) {
        return value;
      }

      if (
        isExternalUrl(value) ||
        value.startsWith("#")
      ) {
        return value;
      }

      const baseDirectory = getDirectoryFromPath(basePath);

      const fakeBase =
        `https://example.local/${baseDirectory}`;

      const resolved = new URL(value, fakeBase);

      return resolved.pathname.replace(/^\/+/, "");
    }

    function rawUrlFor(path) {
      return RAW_ROOT + path.replace(/^\/+/, "");
    }

    function rewriteUrl(value, basePath) {
      if (!value) {
        return value;
      }

      if (
        isExternalUrl(value) ||
        value.startsWith("#")
      ) {
        return value;
      }

      const repoPath = resolveRepoPath(value, basePath);

      return cacheBust(rawUrlFor(repoPath));
    }

    function rewriteAttributeUrls(
      documentRoot,
      selector,
      attribute,
      basePath
    ) {
      documentRoot
        .querySelectorAll(selector)
        .forEach(element => {
          const value = element.getAttribute(attribute);

          if (!value) {
            return;
          }

          element.setAttribute(
            attribute,
            rewriteUrl(value, basePath)
          );
        });
    }

    function rewriteSrcset(documentRoot, basePath) {
      documentRoot
        .querySelectorAll("[srcset]")
        .forEach(element => {
          const srcset = element.getAttribute("srcset");

          if (!srcset) {
            return;
          }

          const rewritten = srcset
            .split(",")
            .map(candidate => {
              const parts = candidate.trim().split(/\s+/);
              const url = parts.shift();

              return [
                rewriteUrl(url, basePath),
                ...parts
              ].join(" ");
            })
            .join(", ");

          element.setAttribute("srcset", rewritten);
        });
    }

    function rewriteInlineStyles(documentRoot, basePath) {
      documentRoot
        .querySelectorAll("[style]")
        .forEach(element => {
          const style = element.getAttribute("style");

          if (!style) {
            return;
          }

          const rewritten = style.replace(
            /url\((['"]?)(.*?)\1\)/gi,
            (match, quote, url) => {
              if (
                isExternalUrl(url) ||
                url.startsWith("data:")
              ) {
                return match;
              }

              return `url("${rewriteUrl(url, basePath)}")`;
            }
          );

          element.setAttribute("style", rewritten);
        });
    }

    async function fetchAndRewriteStylesheets(
      documentRoot,
      basePath
    ) {
      const stylesheets = [
        ...documentRoot.querySelectorAll(
          'link[rel="stylesheet"][href]'
        )
      ];

      await Promise.all(
        stylesheets.map(async link => {
          const originalHref = link.getAttribute("href");

          if (!originalHref) {
            return;
          }

          const stylesheetPath =
            resolveRepoPath(originalHref, basePath);

          const stylesheetUrl =
            rawUrlFor(stylesheetPath);

          try {
            const response = await fetch(
              cacheBust(stylesheetUrl),
              {
                cache: "no-store"
              }
            );

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status} for ${stylesheetUrl}`
              );
            }

            let css = await response.text();

            const stylesheetDirectory =
              getDirectoryFromPath(stylesheetPath);

            css = css.replace(
              /url\((['"]?)(.*?)\1\)/gi,
              (match, quote, assetUrl) => {
                if (
                  isExternalUrl(assetUrl) ||
                  assetUrl.startsWith("data:")
                ) {
                  return match;
                }

                const fakeBase =
                  `https://example.local/${stylesheetDirectory}`;

                const resolved =
                  new URL(assetUrl, fakeBase);

                const repoPath =
                  resolved.pathname.replace(/^\/+/, "");

                return `url("${cacheBust(rawUrlFor(repoPath))}")`;
              }
            );

            const style =
              documentRoot.createElement("style");

            style.textContent = css;

            link.replaceWith(style);

          } catch (error) {
            console.warn(
              "Could not inline stylesheet:",
              stylesheetUrl,
              error
            );

            link.href =
              cacheBust(stylesheetUrl);
          }
        })
      );
    }

    function rewriteDocumentUrls(documentRoot, basePath) {
      rewriteAttributeUrls(
        documentRoot,
        "[src]",
        "src",
        basePath
      );

      rewriteAttributeUrls(
        documentRoot,
        "[poster]",
        "poster",
        basePath
      );

      rewriteAttributeUrls(
        documentRoot,
        "[action]",
        "action",
        basePath
      );

      rewriteSrcset(
        documentRoot,
        basePath
      );

      rewriteInlineStyles(
        documentRoot,
        basePath
      );
    }

    function injectPreviewNavigation(
      documentRoot,
      basePath
    ) {
      const script =
        documentRoot.createElement("script");

      script.textContent = `
        (() => {
          const CURRENT_PATH =
            ${JSON.stringify(basePath)};

          function isExternalUrl(value) {
            return (
              /^(?:[a-z]+:)?\\\\/\\\\//i.test(value) ||
              value.startsWith("mailto:") ||
              value.startsWith("tel:") ||
              value.startsWith("data:") ||
              value.startsWith("blob:")
            );
          }

          document.addEventListener("click", event => {
            const link =
              event.target.closest("a[href]");

            if (!link) {
              return;
            }

            const href =
              link.getAttribute("href");

            if (!href) {
              return;
            }

            if (href.startsWith("#")) {
              return;
            }

            if (isExternalUrl(href)) {
              return;
            }

            event.preventDefault();

            window.parent.postMessage(
              {
                type: "previewNavigate",
                href,
                basePath: CURRENT_PATH
              },
              "*"
            );
          });
        })();
      `;

      documentRoot.head.appendChild(script);
    }

    function injectBase(documentRoot, basePath) {
      const directory =
        getDirectoryFromPath(basePath);

      let base =
        documentRoot.querySelector("base");

      if (!base) {
        base =
          documentRoot.createElement("base");

        documentRoot.head.prepend(base);
      }

      base.href =
        rawUrlFor(directory);
    }

    async function loadPage(path) {
      currentPath =
        path.replace(/^\/+/, "");

      try {
        const url =
          rawUrlFor(currentPath);

        const response = await fetch(
          cacheBust(url),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `Unable to load ${currentPath}.\n\n` +
            `HTTP status: ${response.status}`
          );
        }

        const html =
          await response.text();

        const parser =
          new DOMParser();

        const documentRoot =
          parser.parseFromString(
            html,
            "text/html"
          );

        injectBase(
          documentRoot,
          currentPath
        );

        await fetchAndRewriteStylesheets(
          documentRoot,
          currentPath
        );

        rewriteDocumentUrls(
          documentRoot,
          currentPath
        );

        injectPreviewNavigation(
          documentRoot,
          currentPath
        );

        const serialisedHtml =
          "<!DOCTYPE html>" +
          documentRoot.documentElement.outerHTML;

        frame.srcdoc =
          serialisedHtml;

      } catch (error) {
        console.error(error);

        frame.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <style>
              html,
              body {
                margin: 0;
                padding: 30px;
                background: #111;
                color: #ff8b8b;
                font-family: monospace;
                white-space: pre-wrap;
              }
            </style>
          </head>
          <body>${escapeHtml(error.message)}</body>
          </html>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener(
      "message",
      event => {
        if (
          !event.data ||
          event.data.type !== "previewNavigate"
        ) {
          return;
        }

        const {
          href,
          basePath
        } = event.data;

        const targetPath =
          resolveRepoPath(
            href,
            basePath
          );

        loadPage(targetPath);
      }
    );

    loadPage(CONFIG.entryFile);
  </script>

</body>
</html>
