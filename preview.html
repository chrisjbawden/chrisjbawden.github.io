<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script>
    (() => {
      const hasDevCookie = document.cookie
        .split(";")
        .map(cookie => cookie.trim())
        .some(cookie => cookie === "dev=1");

      if (!hasDevCookie) {
        window.location.replace("/index.html");
      }
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>dev</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>

<body>

  <iframe
    id="previewFrame"
    title="dev"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
  ></iframe>

  <script>
    const CONFIG = {
      owner: "chrisjbawden",
      repo: "chrisjbawden.github.io",
      branch: "master",
      directory: "dev",
      entryFile: "index.html",

      liveOrigins: [
        "https://chrisjbawden.github.io",
        "http://chrisjbawden.github.io"
      ]
    };

    const frame = document.getElementById("previewFrame");

    const RAW_ROOT =
      `https://raw.githubusercontent.com/` +
      `${CONFIG.owner}/` +
      `${CONFIG.repo}/` +
      `${CONFIG.branch}/` +
      `${CONFIG.directory}/`;

    let currentPath = CONFIG.entryFile;


    /*
     * ------------------------------------------------------------
     * Cache busting
     * ------------------------------------------------------------
     */

    function cacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";

      return `${url}${separator}_dev=${Date.now()}`;
    }


    /*
     * ------------------------------------------------------------
     * URL helpers
     * ------------------------------------------------------------
     */

    function isExternalUrl(value) {
      if (!value) {
        return false;
      }

      return (
        /^(?:[a-z]+:)?\/\//i.test(value) ||
        value.startsWith("mailto:") ||
        value.startsWith("tel:") ||
        value.startsWith("data:") ||
        value.startsWith("blob:") ||
        value.startsWith("javascript:")
      );
    }


    function getDirectoryFromPath(path) {
      const normalised =
        path.replace(/^\/+/, "");

      const lastSlash =
        normalised.lastIndexOf("/");

      if (lastSlash === -1) {
        return "";
      }

      return normalised.slice(
        0,
        lastSlash + 1
      );
    }


    function rawUrlFor(path) {
      return (
        RAW_ROOT +
        path.replace(/^\/+/, "")
      );
    }


    /*
     * ------------------------------------------------------------
     * Live-site link scrubbing
     * ------------------------------------------------------------
     *
     * /about.html
     * becomes
     * about.html
     *
     * https://chrisjbawden.github.io/about.html
     * becomes
     * about.html
     */

    function scrubLiveSiteUrl(value) {
      if (!value) {
        return value;
      }

      if (value.startsWith("#")) {
        return value;
      }

      if (value.startsWith("/")) {
        const cleaned =
          value.replace(/^\/+/, "");

        return cleaned || CONFIG.entryFile;
      }

      for (const origin of CONFIG.liveOrigins) {
        if (value.startsWith(origin)) {
          let cleaned =
            value.slice(origin.length);

          cleaned =
            cleaned.replace(/^\/+/, "");

          return cleaned || CONFIG.entryFile;
        }
      }

      return value;
    }


    /*
     * ------------------------------------------------------------
     * Path resolution
     * ------------------------------------------------------------
     */

    function resolveRepoPath(
      value,
      basePath = currentPath
    ) {
      if (!value) {
        return value;
      }

      value =
        scrubLiveSiteUrl(value);

      if (value.startsWith("#")) {
        return value;
      }

      if (isExternalUrl(value)) {
        return value;
      }

      const baseDirectory =
        getDirectoryFromPath(basePath);

      const fakeBase =
        `https://preview.local/${baseDirectory}`;

      try {
        const resolved =
          new URL(value, fakeBase);

        return resolved.pathname
          .replace(/^\/+/, "");

      } catch (error) {
        console.warn(
          "Unable to resolve path:",
          value,
          error
        );

        return value;
      }
    }


    /*
     * ------------------------------------------------------------
     * Asset URL rewriting
     * ------------------------------------------------------------
     */

    function rewriteAssetUrl(
      value,
      basePath
    ) {
      if (!value) {
        return value;
      }

      if (
        isExternalUrl(value) ||
        value.startsWith("#")
      ) {
        return value;
      }

      const repoPath =
        resolveRepoPath(
          value,
          basePath
        );

      return cacheBust(
        rawUrlFor(repoPath)
      );
    }


    function rewriteAttributeUrls(
      documentRoot,
      selector,
      attribute,
      basePath
    ) {
      documentRoot
        .querySelectorAll(selector)
        .forEach(element => {
          const value =
            element.getAttribute(attribute);

          if (!value) {
            return;
          }

          element.setAttribute(
            attribute,
            rewriteAssetUrl(
              value,
              basePath
            )
          );
        });
    }


    /*
     * ------------------------------------------------------------
     * srcset
     * ------------------------------------------------------------
     */

    function rewriteSrcset(
      documentRoot,
      basePath
    ) {
      documentRoot
        .querySelectorAll("[srcset]")
        .forEach(element => {
          const srcset =
            element.getAttribute("srcset");

          if (!srcset) {
            return;
          }

          const rewritten =
            srcset
              .split(",")
              .map(candidate => {
                const parts =
                  candidate
                    .trim()
                    .split(/\s+/);

                const url =
                  parts.shift();

                return [
                  rewriteAssetUrl(
                    url,
                    basePath
                  ),
                  ...parts
                ].join(" ");
              })
              .join(", ");

          element.setAttribute(
            "srcset",
            rewritten
          );
        });
    }


    /*
     * ------------------------------------------------------------
     * Inline style URLs
     * ------------------------------------------------------------
     */

    function rewriteInlineStyles(
      documentRoot,
      basePath
    ) {
      documentRoot
        .querySelectorAll("[style]")
        .forEach(element => {
          const style =
            element.getAttribute("style");

          if (!style) {
            return;
          }

          const rewritten =
            style.replace(
              /url\((['"]?)(.*?)\1\)/gi,
              (
                match,
                quote,
                assetUrl
              ) => {
                if (
                  isExternalUrl(assetUrl) ||
                  assetUrl.startsWith("data:")
                ) {
                  return match;
                }

                return (
                  `url("` +
                  rewriteAssetUrl(
                    assetUrl,
                    basePath
                  ) +
                  `")`
                );
              }
            );

          element.setAttribute(
            "style",
            rewritten
          );
        });
    }


    /*
     * ------------------------------------------------------------
     * Stylesheets
     * ------------------------------------------------------------
     */

    async function fetchAndRewriteStylesheets(
      documentRoot,
      basePath
    ) {
      const stylesheets = [
        ...documentRoot.querySelectorAll(
          'link[rel="stylesheet"][href]'
        )
      ];

      await Promise.all(
        stylesheets.map(
          async link => {
            const originalHref =
              link.getAttribute("href");

            if (!originalHref) {
              return;
            }

            if (isExternalUrl(originalHref)) {
              return;
            }

            const stylesheetPath =
              resolveRepoPath(
                originalHref,
                basePath
              );

            const stylesheetUrl =
              rawUrlFor(
                stylesheetPath
              );

            try {
              const response =
                await fetch(
                  cacheBust(
                    stylesheetUrl
                  ),
                  {
                    cache: "no-store"
                  }
                );

              if (!response.ok) {
                throw new Error(
                  `HTTP ${response.status} ` +
                  `for ${stylesheetUrl}`
                );
              }

              let css =
                await response.text();

              const stylesheetDirectory =
                getDirectoryFromPath(
                  stylesheetPath
                );

              css = css.replace(
                /url\((['"]?)(.*?)\1\)/gi,
                (
                  match,
                  quote,
                  assetUrl
                ) => {
                  if (
                    isExternalUrl(assetUrl) ||
                    assetUrl.startsWith("data:")
                  ) {
                    return match;
                  }

                  try {
                    const fakeBase =
                      `https://preview.local/` +
                      stylesheetDirectory;

                    const resolved =
                      new URL(
                        assetUrl,
                        fakeBase
                      );

                    const repoPath =
                      resolved.pathname
                        .replace(/^\/+/, "");

                    return (
                      `url("` +
                      cacheBust(
                        rawUrlFor(repoPath)
                      ) +
                      `")`
                    );

                  } catch {
                    return match;
                  }
                }
              );

              const style =
                documentRoot
                  .createElement("style");

              style.textContent =
                css;

              link.replaceWith(
                style
              );

            } catch (error) {
              console.warn(
                "Could not inline stylesheet:",
                stylesheetUrl,
                error
              );

              link.href =
                cacheBust(
                  stylesheetUrl
                );
            }
          }
        )
      );
    }


    /*
     * ------------------------------------------------------------
     * Document asset rewriting
     * ------------------------------------------------------------
     */

    function rewriteDocumentAssets(
      documentRoot,
      basePath
    ) {
      rewriteAttributeUrls(
        documentRoot,
        "[src]",
        "src",
        basePath
      );

      rewriteAttributeUrls(
        documentRoot,
        "[poster]",
        "poster",
        basePath
      );

      rewriteSrcset(
        documentRoot,
        basePath
      );

      rewriteInlineStyles(
        documentRoot,
        basePath
      );
    }


    /*
     * ------------------------------------------------------------
     * Remove base elements
     * ------------------------------------------------------------
     *
     * This is important.
     *
     * A <base> element can cause relative links to resolve
     * directly to raw.githubusercontent.com, which then causes
     * the iframe to fail with "refused to connect".
     */

    function removeBaseElements(
      documentRoot
    ) {
      documentRoot
        .querySelectorAll("base")
        .forEach(base => {
          base.remove();
        });
    }


    /*
     * ------------------------------------------------------------
     * Link scrubbing
     * ------------------------------------------------------------
     */

    function scrubDocumentLinks(
      documentRoot
    ) {
      documentRoot
        .querySelectorAll("a[href]")
        .forEach(link => {
          const href =
            link.getAttribute("href");

          if (!href) {
            return;
          }

          if (
            href.startsWith("#") ||
            href.startsWith("mailto:") ||
            href.startsWith("tel:") ||
            href.startsWith("javascript:")
          ) {
            return;
          }

          const scrubbed =
            scrubLiveSiteUrl(
              href
            );

          link.setAttribute(
            "href",
            scrubbed
          );
        });
    }


    /*
     * ------------------------------------------------------------
     * Navigation script injected into iframe
     * ------------------------------------------------------------
     */

    function injectPreviewNavigation(
      documentRoot,
      basePath
    ) {
      const script =
        documentRoot
          .createElement("script");

      script.textContent = `
        (() => {

          const CURRENT_PATH =
            ${JSON.stringify(basePath)};


          document.addEventListener(
            "click",
            event => {

              const link =
                event.target.closest(
                  "a[href]"
                );

              if (!link) {
                return;
              }

              const href =
                link.getAttribute(
                  "href"
                );

              if (!href) {
                return;
              }

              if (
                href.startsWith("#")
              ) {
                return;
              }

              if (
                href.startsWith("mailto:") ||
                href.startsWith("tel:") ||
                href.startsWith("javascript:")
              ) {
                return;
              }

              /*
               * Genuine external links should behave normally.
               */
              if (
                /^(?:https?:)?\\\\/\\\\//i.test(href)
              ) {
                return;
              }

              /*
               * Prevent the iframe from navigating itself.
               */
              event.preventDefault();

              event.stopPropagation();

              window.parent.postMessage(
                {
                  type:
                    "previewNavigate",

                  href:
                    href,

                  basePath:
                    CURRENT_PATH
                },
                "*"
              );

            },
            true
          );

        })();
      `;

      documentRoot
        .head
        .appendChild(
          script
        );
    }


    /*
     * ------------------------------------------------------------
     * Navigation message handler
     * ------------------------------------------------------------
     */

    window.addEventListener(
      "message",
      event => {
        if (
          !event.data ||
          event.data.type !==
            "previewNavigate"
        ) {
          return;
        }

        const {
          href,
          basePath
        } = event.data;

        const targetPath =
          resolveRepoPath(
            href,
            basePath
          );

        if (
          isExternalUrl(targetPath)
        ) {
          window.location.href =
            targetPath;

          return;
        }

        loadPage(
          targetPath
        );
      }
    );


    /*
     * ------------------------------------------------------------
     * Page loader
     * ------------------------------------------------------------
     */

    async function loadPage(path) {
      currentPath =
        path.replace(/^\/+/, "");

      if (
        currentPath.endsWith("/")
      ) {
        currentPath +=
          "index.html";
      }

      try {
        const url =
          rawUrlFor(
            currentPath
          );

        const response =
          await fetch(
            cacheBust(url),
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `Unable to load ${currentPath}.\n\n` +
            `HTTP status: ${response.status}\n\n` +
            `Requested from:\n${url}`
          );
        }

        const html =
          await response.text();

        const parser =
          new DOMParser();

        const documentRoot =
          parser.parseFromString(
            html,
            "text/html"
          );


        /*
         * Remove any existing base element before doing
         * anything else.
         */
        removeBaseElements(
          documentRoot
        );


        /*
         * Fetch and rewrite CSS.
         */
        await fetchAndRewriteStylesheets(
          documentRoot,
          currentPath
        );


        /*
         * Rewrite images, scripts and other assets.
         */
        rewriteDocumentAssets(
          documentRoot,
          currentPath
        );


        /*
         * Rewrite production-site links to dev links.
         */
        scrubDocumentLinks(
          documentRoot
        );


        /*
         * Intercept clicks so the iframe never navigates
         * directly to raw.githubusercontent.com.
         */
        injectPreviewNavigation(
          documentRoot,
          currentPath
        );


        const serialisedHtml =
          "<!DOCTYPE html>" +
          documentRoot
            .documentElement
            .outerHTML;


        frame.srcdoc =
          serialisedHtml;

      } catch (error) {
        showError(
          error
        );
      }
    }


    /*
     * ------------------------------------------------------------
     * Error handling
     * ------------------------------------------------------------
     */

    function showError(error) {
      console.error(
        error
      );

      frame.srcdoc = `
        <!DOCTYPE html>
        <html lang="en">

        <head>
          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>dev</title>

          <style>
            html,
            body {
              margin: 0;
              min-height: 100%;
              background: #111;
              color: #ff8b8b;
              font-family: monospace;
            }

            body {
              padding: 30px;
              box-sizing: border-box;
              white-space: pre-wrap;
            }
          </style>
        </head>

        <body>${escapeHtml(error.message)}</body>

        </html>
      `;
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
     * ------------------------------------------------------------
     * Start
     * ------------------------------------------------------------
     */

    loadPage(
      CONFIG.entryFile
    );
  </script>

</body>
</html>
