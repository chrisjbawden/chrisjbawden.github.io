<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--
    DEV ACCESS CHECK

    Requires:
      dev=1

    Example for setting it from the browser console:

      document.cookie = "dev=1; path=/; max-age=31536000; SameSite=Lax";
  -->
  <script>
    (() => {
      const hasDevCookie = document.cookie
        .split(";")
        .map(cookie => cookie.trim())
        .some(cookie => cookie === "dev=1");

      if (!hasDevCookie) {
        window.location.replace("/index.html");
      }
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Dev Preview</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>

<body>

  <iframe
    id="previewFrame"
    title="Development Preview"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
  ></iframe>

  <script>
    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     */

    const CONFIG = {
      owner: "chrisjbawden",
      repo: "chrisjbawden.github.io",
      branch: "master",
      directory: "dev",
      entryFile: "index.html",

      liveOrigins: [
        "https://chrisjbawden.github.io",
        "http://chrisjbawden.github.io"
      ]
    };


    /*
     * ============================================================
     * INITIAL SETUP
     * ============================================================
     */

    const frame = document.getElementById("previewFrame");

    const RAW_ROOT =
      `https://raw.githubusercontent.com/` +
      `${CONFIG.owner}/` +
      `${CONFIG.repo}/` +
      `${CONFIG.branch}/` +
      `${CONFIG.directory}/`;

    let currentPath = CONFIG.entryFile;


    /*
     * ============================================================
     * CACHE BUSTING
     * ============================================================
     */

    function cacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";

      return `${url}${separator}_dev=${Date.now()}`;
    }


    /*
     * ============================================================
     * URL HELPERS
     * ============================================================
     */

    function isExternalUrl(value) {
      if (!value) {
        return false;
      }

      return (
        /^(?:[a-z]+:)?\/\//i.test(value) ||
        value.startsWith("mailto:") ||
        value.startsWith("tel:") ||
        value.startsWith("data:") ||
        value.startsWith("blob:") ||
        value.startsWith("javascript:")
      );
    }


    function isLiveSiteUrl(value) {
      if (!value) {
        return false;
      }

      return CONFIG.liveOrigins.some(origin =>
        value.startsWith(origin)
      );
    }


    function getDirectoryFromPath(path) {
      const normalised =
        path.replace(/^\/+/, "");

      const lastSlash =
        normalised.lastIndexOf("/");

      if (lastSlash === -1) {
        return "";
      }

      return normalised.slice(
        0,
        lastSlash + 1
      );
    }


    function rawUrlFor(path) {
      return (
        RAW_ROOT +
        path.replace(/^\/+/, "")
      );
    }


    /*
     * ============================================================
     * LIVE SITE LINK SCRUBBING
     * ============================================================
     *
     * Converts:
     *
     *   /projects.html
     *
     * into:
     *
     *   projects.html
     *
     *
     * Converts:
     *
     *   https://chrisjbawden.github.io/projects.html
     *
     * into:
     *
     *   projects.html
     *
     *
     * This allows copied production HTML to navigate through
     * the /dev version instead.
     */

    function scrubLiveSiteUrl(value) {
      if (!value) {
        return value;
      }

      /*
       * Leave page anchors alone.
       */
      if (value.startsWith("#")) {
        return value;
      }


      /*
       * Root-relative URL.
       *
       * Example:
       *
       * /projects.html
       *
       * becomes:
       *
       * projects.html
       */
      if (value.startsWith("/")) {
        const cleaned =
          value.replace(/^\/+/, "");

        return cleaned || CONFIG.entryFile;
      }


      /*
       * Absolute link back to production.
       */
      for (const origin of CONFIG.liveOrigins) {
        if (value.startsWith(origin)) {
          let cleaned =
            value.slice(origin.length);

          cleaned =
            cleaned.replace(/^\/+/, "");

          return cleaned || CONFIG.entryFile;
        }
      }


      return value;
    }


    /*
     * ============================================================
     * PATH RESOLUTION
     * ============================================================
     */

    function resolveRepoPath(
      value,
      basePath = currentPath
    ) {
      if (!value) {
        return value;
      }


      /*
       * First convert links pointing at the production site
       * into development-relative links.
       */
      value = scrubLiveSiteUrl(value);


      /*
       * Anchors don't require path resolution.
       */
      if (value.startsWith("#")) {
        return value;
      }


      /*
       * Genuine external URLs stay external.
       */
      if (isExternalUrl(value)) {
        return value;
      }


      const baseDirectory =
        getDirectoryFromPath(basePath);


      /*
       * Use a fake origin purely to let URL() correctly resolve:
       *
       * ../
       * ./
       * nested directories
       */
      const fakeBase =
        `https://preview.local/${baseDirectory}`;


      try {
        const resolved =
          new URL(value, fakeBase);

        return resolved.pathname
          .replace(/^\/+/, "");

      } catch (error) {
        console.warn(
          "Unable to resolve path:",
          value,
          error
        );

        return value;
      }
    }


    /*
     * ============================================================
     * ASSET URL REWRITING
     * ============================================================
     */

    function rewriteAssetUrl(
      value,
      basePath
    ) {
      if (!value) {
        return value;
      }


      /*
       * Do NOT scrub production URLs for assets.
       *
       * Only relative development assets are rewritten.
       */
      if (
        isExternalUrl(value) ||
        value.startsWith("#")
      ) {
        return value;
      }


      const repoPath =
        resolveRepoPath(
          value,
          basePath
        );


      return cacheBust(
        rawUrlFor(repoPath)
      );
    }


    function rewriteAttributeUrls(
      documentRoot,
      selector,
      attribute,
      basePath
    ) {
      documentRoot
        .querySelectorAll(selector)
        .forEach(element => {
          const value =
            element.getAttribute(attribute);

          if (!value) {
            return;
          }

          element.setAttribute(
            attribute,
            rewriteAssetUrl(
              value,
              basePath
            )
          );
        });
    }


    /*
     * ============================================================
     * SRCSET
     * ============================================================
     */

    function rewriteSrcset(
      documentRoot,
      basePath
    ) {
      documentRoot
        .querySelectorAll("[srcset]")
        .forEach(element => {
          const srcset =
            element.getAttribute("srcset");

          if (!srcset) {
            return;
          }


          const rewritten = srcset
            .split(",")
            .map(candidate => {
              const parts =
                candidate
                  .trim()
                  .split(/\s+/);

              const url =
                parts.shift();


              return [
                rewriteAssetUrl(
                  url,
                  basePath
                ),
                ...parts
              ].join(" ");
            })
            .join(", ");


          element.setAttribute(
            "srcset",
            rewritten
          );
        });
    }


    /*
     * ============================================================
     * INLINE STYLE URLS
     * ============================================================
     */

    function rewriteInlineStyles(
      documentRoot,
      basePath
    ) {
      documentRoot
        .querySelectorAll("[style]")
        .forEach(element => {
          const style =
            element.getAttribute("style");

          if (!style) {
            return;
          }


          const rewritten =
            style.replace(
              /url\((['"]?)(.*?)\1\)/gi,

              (
                match,
                quote,
                assetUrl
              ) => {

                if (
                  isExternalUrl(assetUrl) ||
                  assetUrl.startsWith("data:")
                ) {
                  return match;
                }


                return (
                  `url("` +
                  rewriteAssetUrl(
                    assetUrl,
                    basePath
                  ) +
                  `")`
                );
              }
            );


          element.setAttribute(
            "style",
            rewritten
          );
        });
    }


    /*
     * ============================================================
     * STYLESHEETS
     * ============================================================
     */

    async function fetchAndRewriteStylesheets(
      documentRoot,
      basePath
    ) {
      const stylesheets = [
        ...documentRoot.querySelectorAll(
          'link[rel="stylesheet"][href]'
        )
      ];


      await Promise.all(
        stylesheets.map(
          async link => {

            const originalHref =
              link.getAttribute("href");


            if (!originalHref) {
              return;
            }


            /*
             * Leave genuinely external stylesheets alone.
             *
             * Examples:
             *
             * Google Fonts
             * CDN libraries
             */
            if (isExternalUrl(originalHref)) {
              return;
            }


            const stylesheetPath =
              resolveRepoPath(
                originalHref,
                basePath
              );


            const stylesheetUrl =
              rawUrlFor(
                stylesheetPath
              );


            try {
              const response =
                await fetch(
                  cacheBust(
                    stylesheetUrl
                  ),
                  {
                    cache: "no-store"
                  }
                );


              if (!response.ok) {
                throw new Error(
                  `HTTP ${response.status} ` +
                  `for ${stylesheetUrl}`
                );
              }


              let css =
                await response.text();


              const stylesheetDirectory =
                getDirectoryFromPath(
                  stylesheetPath
                );


              /*
               * Rewrite url(...) references inside CSS.
               *
               * Example:
               *
               * ../images/background.jpg
               */
              css = css.replace(
                /url\((['"]?)(.*?)\1\)/gi,

                (
                  match,
                  quote,
                  assetUrl
                ) => {

                  if (
                    isExternalUrl(assetUrl) ||
                    assetUrl.startsWith("data:")
                  ) {
                    return match;
                  }


                  try {
                    const fakeBase =
                      `https://preview.local/` +
                      stylesheetDirectory;


                    const resolved =
                      new URL(
                        assetUrl,
                        fakeBase
                      );


                    const repoPath =
                      resolved.pathname
                        .replace(/^\/+/, "");


                    return (
                      `url("` +
                      cacheBust(
                        rawUrlFor(repoPath)
                      ) +
                      `")`
                    );

                  } catch {
                    return match;
                  }
                }
              );


              /*
               * Replace the stylesheet link with the
               * freshly fetched CSS.
               */
              const style =
                documentRoot
                  .createElement("style");


              style.textContent = css;


              link.replaceWith(style);

            } catch (error) {
              console.warn(
                "Could not inline stylesheet:",
                stylesheetUrl,
                error
              );


              /*
               * Fall back to direct raw GitHub loading.
               */
              link.href =
                cacheBust(
                  stylesheetUrl
                );
            }
          }
        )
      );
    }


    /*
     * ============================================================
     * DOCUMENT ASSETS
     * ============================================================
     */

    function rewriteDocumentAssets(
      documentRoot,
      basePath
    ) {
      /*
       * JavaScript
       * Images
       * Video
       * Audio
       * iframe sources
       */
      rewriteAttributeUrls(
        documentRoot,
        "[src]",
        "src",
        basePath
      );


      /*
       * Video poster images.
       */
      rewriteAttributeUrls(
        documentRoot,
        "[poster]",
        "poster",
        basePath
      );


      rewriteSrcset(
        documentRoot,
        basePath
      );


      rewriteInlineStyles(
        documentRoot,
        basePath
      );
    }


    /*
     * ============================================================
     * LINK SCRUBBING
     * ============================================================
     */

    function scrubDocumentLinks(
      documentRoot
    ) {
      documentRoot
        .querySelectorAll("a[href]")
        .forEach(link => {

          const href =
            link.getAttribute("href");


          if (!href) {
            return;
          }


          /*
           * Leave special links alone.
           */
          if (
            href.startsWith("#") ||
            href.startsWith("mailto:") ||
            href.startsWith("tel:") ||
            href.startsWith("javascript:")
          ) {
            return;
          }


          /*
           * Convert links back to the production site
           * into development-relative links.
           */
          const scrubbed =
            scrubLiveSiteUrl(href);


          link.setAttribute(
            "href",
            scrubbed
          );
        });
    }


    /*
     * ============================================================
     * BASE ELEMENT
     * ============================================================
     */

    function injectBase(
      documentRoot,
      basePath
    ) {
      const directory =
        getDirectoryFromPath(
          basePath
        );


      let base =
        documentRoot
          .querySelector("base");


      if (!base) {
        base =
          documentRoot
            .createElement("base");


        documentRoot
          .head
          .prepend(base);
      }


      base.href =
        rawUrlFor(directory);
    }


    /*
     * ============================================================
     * PREVIEW NAVIGATION
     * ============================================================
     *
     * This script runs INSIDE the iframe.
     *
     * Instead of allowing the iframe to navigate directly
     * to raw.githubusercontent.com, it tells preview.html
     * which page needs to be loaded.
     */

    function injectPreviewNavigation(
      documentRoot,
      basePath
    ) {
      const script =
        documentRoot
          .createElement("script");


      script.textContent = `
        (() => {

          const CURRENT_PATH =
            ${JSON.stringify(basePath)};


          document.addEventListener(
            "click",
            event => {

              const link =
                event.target.closest(
                  "a[href]"
                );


              if (!link) {
                return;
              }


              const href =
                link.getAttribute(
                  "href"
                );


              if (!href) {
                return;
              }


              /*
               * Normal page anchor.
               */
              if (
                href.startsWith("#")
              ) {
                return;
              }


              /*
               * Mail and telephone links.
               */
              if (
                href.startsWith("mailto:") ||
                href.startsWith("tel:")
              ) {
                return;
              }


              /*
               * Genuine external website.
               *
               * Allow normal browser behaviour.
               */
              if (
                /^(?:https?:)?\\\\/\\\\//i.test(href)
              ) {
                return;
              }


              /*
               * Internal development navigation.
               */
              event.preventDefault();


              window.parent.postMessage(
                {
                  type:
                    "previewNavigate",

                  href:
                    href,

                  basePath:
                    CURRENT_PATH
                },
                "*"
              );

            }
          );

        })();
      `;


      documentRoot
        .head
        .appendChild(script);
    }


    /*
     * ============================================================
     * NAVIGATION MESSAGE HANDLER
     * ============================================================
     */

    window.addEventListener(
      "message",
      event => {

        if (
          !event.data ||
          event.data.type !==
            "previewNavigate"
        ) {
          return;
        }


        const {
          href,
          basePath
        } = event.data;


        const targetPath =
          resolveRepoPath(
            href,
            basePath
          );


        /*
         * Something unexpected resolved externally.
         */
        if (
          isExternalUrl(targetPath)
        ) {
          window.location.href =
            targetPath;

          return;
        }


        loadPage(
          targetPath
        );
      }
    );


    /*
     * ============================================================
     * PAGE LOADER
     * ============================================================
     */

    async function loadPage(path) {

      currentPath =
        path.replace(/^\/+/, "");


      /*
       * Directory URLs default to index.html.
       *
       * Example:
       *
       * projects/
       *
       * becomes:
       *
       * projects/index.html
       */
      if (
        currentPath.endsWith("/")
      ) {
        currentPath +=
          "index.html";
      }


      try {

        const url =
          rawUrlFor(
            currentPath
          );


        /*
         * Cache-bust the HTML request.
         */
        const response =
          await fetch(
            cacheBust(url),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            `Unable to load ${currentPath}.\n\n` +
            `HTTP status: ${response.status}\n\n` +
            `Requested from:\n${url}`
          );
        }


        const html =
          await response.text();


        const parser =
          new DOMParser();


        const documentRoot =
          parser.parseFromString(
            html,
            "text/html"
          );


        /*
         * Establish the correct directory context.
         */
        injectBase(
          documentRoot,
          currentPath
        );


        /*
         * Fetch fresh CSS and rewrite CSS assets.
         */
        await fetchAndRewriteStylesheets(
          documentRoot,
          currentPath
        );


        /*
         * Rewrite images, JavaScript and other assets.
         */
        rewriteDocumentAssets(
          documentRoot,
          currentPath
        );


        /*
         * Convert production-site navigation links
         * into development navigation.
         */
        scrubDocumentLinks(
          documentRoot
        );


        /*
         * Intercept internal navigation.
         */
        injectPreviewNavigation(
          documentRoot,
          currentPath
        );


        /*
         * Reconstruct the complete document.
         */
        const serialisedHtml =
          "<!DOCTYPE html>" +
          documentRoot
            .documentElement
            .outerHTML;


        /*
         * Render inside the preview iframe.
         */
        frame.srcdoc =
          serialisedHtml;

      } catch (error) {

        showError(error);

      }
    }


    /*
     * ============================================================
     * ERROR DISPLAY
     * ============================================================
     */

    function showError(error) {
      console.error(error);


      frame.srcdoc = `
        <!DOCTYPE html>

        <html lang="en">

        <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>Preview Error</title>

          <style>
            html,
            body {
              margin: 0;
              min-height: 100%;
              background: #111;
              color: #ff8b8b;
              font-family: monospace;
            }

            body {
              padding: 30px;
              box-sizing: border-box;
              white-space: pre-wrap;
            }
          </style>

        </head>

        <body>${escapeHtml(error.message)}</body>

        </html>
      `;
    }


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
     * ============================================================
     * START PREVIEW
     * ============================================================
     */

    loadPage(
      CONFIG.entryFile
    );

  </script>

</body>
</html>
